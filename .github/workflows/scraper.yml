name: Scraper — daily ingest to Worker

on:
  schedule:
    - cron: "30 5 * * *"  # 05:30 UTC daily
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and ingest
        run: python -m lectura
        env:
          INGEST_URL: "https://dreading-api-worker.nativerse.workers.dev/api/ingest"
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
