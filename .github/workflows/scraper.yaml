name: Daily Reading Scraping

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        # Posts each reading to the dreading-api-worker, which enriches it at the
        # edge via its Workers AI binding. Set these repository secrets:
        #   INGEST_URL   = https://<worker>.workers.dev/api/ingest
        #   INGEST_TOKEN = the worker's INGEST_TOKEN secret
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python lectura.py

      - name: Healthcheck — today's reading exists
        if: success()
        run: |
          echo "Checking API health after ingestion..."
          RESP=$(curl -sf "${{ secrets.INGEST_URL%/api/ingest }}/api/v1/readings/today" || true)
          if [ -z "$RESP" ]; then
            echo "::error::Healthcheck failed: API did not respond"
            exit 1
          fi
          COUNT=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total',0))" 2>/dev/null || echo "0")
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::Healthcheck failed: no readings returned (total=$COUNT)"
            exit 1
          fi
          echo "Healthcheck passed: total=$COUNT"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Scraper workflow failed — check logs above"
          # GitHub Actions automatically sends email to the repo owner on workflow failure.
          # For Telegram alerts, add a TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL secret
          # and uncomment the block below:
          # curl -sf "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          #   -d chat_id="${{ secrets.TELEGRAM_CHANNEL }}" \
          #   -d parse_mode="HTML" \
          #   -d text="⚠️ <b>DReading scraper failed</b>%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
